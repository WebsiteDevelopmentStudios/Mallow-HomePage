<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02030a">
  <meta name="description" content="Get Mallow for Windows and Android.">
  <title>Mallow — A place to connect</title>
  <style>
    :root{color-scheme:dark;--white:#f7f8ff;--muted:#b7bed2}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;overflow-x:hidden;background:#02030a;color:var(--white);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body:before,body:after{content:"";position:fixed;inset:-30%;pointer-events:none;z-index:-2;background-repeat:repeat;background-size:370px 330px}
    body:before{opacity:.7;background-image:radial-gradient(1px 1px at 22px 31px,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 117px 91px,#d9d7ff 98%,transparent),radial-gradient(1px 1px at 209px 177px,#fff 98%,transparent),radial-gradient(2px 2px at 311px 55px,#b8c8ff 98%,transparent),radial-gradient(1px 1px at 72px 260px,#fff 98%,transparent);animation:stars-drift 100s linear infinite}
    body:after{opacity:.35;background-size:510px 470px;background-image:radial-gradient(2px 2px at 75px 115px,#fff 98%,transparent),radial-gradient(1px 1px at 245px 305px,#b9c8ff 98%,transparent),radial-gradient(1.5px 1.5px at 440px 180px,#fff 98%,transparent);animation:stars-drift 150s linear infinite reverse}
    @keyframes stars-drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(180px,120px,0)}}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(1160px,calc(100% - 48px));margin:auto;position:relative}
    header{height:86px;display:flex;align-items:center;justify-content:space-between;z-index:3}
    .brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.04em;font-size:1.1rem}
    .brand-mark{width:36px;height:36px;border:1px solid #aaa0ff88;border-radius:12px;display:grid;place-items:center;background:#17152a;color:#d9d2ff;font-size:21px}
    nav{display:flex;align-items:center;gap:clamp(20px,4vw,48px);font-size:.92rem;font-weight:650;color:#d4d6e7}
    nav a:hover{color:#fff}
    .top-download{border:1px solid #ffffff35;border-radius:999px;padding:10px 19px;font-size:.9rem;font-weight:750;background:#ffffff0b}
    main{position:relative;min-height:calc(100vh - 86px);isolation:isolate}
    .intro{position:relative;z-index:2;text-align:center;padding:clamp(55px,10vh,115px) 0 0}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;color:#c9c3ff;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;font-weight:750}
    .eyebrow:before,.eyebrow:after{content:"";width:24px;height:1px;background:#9c8cff88}
    h1{margin:23px 0 17px;font-size:clamp(3rem,7vw,6.3rem);line-height:.94;letter-spacing:-.065em;font-weight:950;text-transform:uppercase}
    h1 span{color:#c5bdff}
    .intro p{max-width:570px;margin:0 auto;color:var(--muted);font-size:clamp(1rem,1.5vw,1.18rem)}
    .downloads{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:34px auto 0}
    .download{min-width:220px;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 20px;border:1px solid #ffffff38;border-radius:11px;background:#f7f7ff;color:#10111c;font-weight:780;box-shadow:0 7px 28px #0008}
    .download.secondary{background:#171629;color:#f3f1ff;border-color:#aaa0ff75}
    .download .arrow{font-size:1.25rem}
    .download small{display:block;font-size:.7rem;line-height:1.25;font-weight:650;opacity:.65;text-align:left}
    /* A flat, face-on Earth disc. The lower part is deliberately clipped by the viewport. */
    main{overflow:hidden}
    .earth-wrap{position:absolute;z-index:0;left:50%;bottom:calc(-180vw + 24vh);transform:translateX(-50%);width:180vw;height:180vw;pointer-events:none}
    .earth{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#08243a;border:2px solid #4bbcff;box-shadow:0 -5px 34px #38baff88,0 -1px 9px #a6e6ffcc}
    .earth:before{content:"";position:absolute;inset:-2%;border-radius:50%;background-color:#124c55;background-image:
      radial-gradient(ellipse 8% 5% at 17% 24%,#57966c 0 60%,transparent 64%),
      radial-gradient(ellipse 10% 7% at 24% 31%,#397b59 0 60%,transparent 64%),
      radial-gradient(ellipse 5% 9% at 29% 43%,#43865e 0 60%,transparent 64%),
      radial-gradient(ellipse 12% 6% at 43% 23%,#4b8b61 0 60%,transparent 64%),
      radial-gradient(ellipse 7% 12% at 49% 35%,#3c805b 0 60%,transparent 64%),
      radial-gradient(ellipse 13% 7% at 66% 27%,#498b60 0 60%,transparent 64%),
      radial-gradient(ellipse 8% 11% at 73% 39%,#397b57 0 60%,transparent 64%),
      radial-gradient(ellipse 10% 6% at 86% 23%,#4c9066 0 60%,transparent 64%),
      radial-gradient(ellipse 6% 5% at 91% 48%,#3b805b 0 60%,transparent 64%),
      repeating-linear-gradient(90deg,#0b3853 0 7%,#176b72 12%,#164b57 19%,#26785e 25%,#0b3853 33%);
      background-size:100% 100%;animation:disc-spin 38s linear infinite;transform-origin:50% 50%;opacity:.98}
    .earth:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,transparent 48%,#020b1b55 78%,#01040c99 100%),linear-gradient(180deg,#a4eaff18,transparent 40%);pointer-events:none}
    @keyframes disc-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .horizon-glow{position:absolute;left:50%;top:0;transform:translateX(-50%);width:94%;height:26px;border-radius:50%;background:#58c9ff;filter:blur(36px);opacity:.65}
    footer{position:absolute;bottom:14px;left:0;right:0;z-index:2;text-align:center;color:#aeb5cb;font-size:.78rem}
    @media(max-width:700px){.wrap{width:calc(100% - 34px)}header{height:72px}.brand{font-size:.98rem}.brand-mark{width:32px;height:32px}nav{display:none}.top-download{padding:9px 14px;font-size:.82rem}.intro{padding-top:8vh}h1{font-size:clamp(2.8rem,12vw,4.4rem)}.intro p{max-width:430px}.downloads{gap:11px;margin-top:27px}.download{width:min(100%,330px);min-width:0;padding:12px 16px}.earth-wrap{width:220vw;height:220vw;bottom:calc(-220vw + 22vh)}.horizon-glow{width:94%;height:20px;filter:blur(30px)}footer{bottom:8px}}
    @media(prefers-reduced-motion:reduce){body:before,body:after,.earth:before{animation:none}}
  </style>
</head>
<body>
  <header class="wrap">
    <a class="brand" href="#" aria-label="Mallow home"><span class="brand-mark">M</span><span>MALLOW</span></a>
    <nav aria-label="Main navigation"><a href="#downloads">Download</a><a href="#about">About</a><a href="#support">Support</a></nav>
    <a class="top-download" href="#downloads">Get Mallow</a>
  </header>
  <main>
    <section class="intro wrap" id="about">
      <div class="eyebrow">A new place to connect</div>
      <h1>Your people.<br><span>Your space.</span></h1>
      <p>Bring your friends and communities together. Mallow makes it easy to chat, share, and feel at home wherever you connect.</p>
      <div class="downloads" id="downloads">
        <a class="download" aria-disabled="true"><span class="arrow">↓</span><span>Download for Windows<small>EXE coming soon</small></span></a>
        <a class="download secondary" aria-disabled="true"><span class="arrow">↓</span><span>Get Mallow for Android<small>APK coming soon</small></span></a>
      </div>
    </section>
    <div class="earth-wrap" aria-hidden="true"><div class="horizon-glow"></div><div class="earth"></div></div>
  </main>
  <footer id="support">Mallow</footer>
</body>
</html>
